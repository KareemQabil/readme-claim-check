name: temporary vrfkit linux build
on:
  push:
    branches:
      - tmp-vrfkit-linux-build-20260930
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch vrfkit v0.2.4
        run: |
          curl -L --fail -o /tmp/vrfkit.tar.gz https://codeload.github.com/yakisoba0728/vrfkit/tar.gz/refs/tags/v0.2.4
          mkdir -p /tmp/vrfkit
          tar -xzf /tmp/vrfkit.tar.gz -C /tmp/vrfkit --strip-components=1
      - name: Build vrfkit
        run: |
          cd /tmp/vrfkit
          cargo build --release -p vrfkit --locked
          strip target/release/vrfkit || true
          ./target/release/vrfkit --help
      - name: Fetch DuckDB CLI v1.5.6
        run: |
          curl -L --fail -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          mkdir -p /tmp/duckdb
          unzip -q /tmp/duckdb.zip -d /tmp/duckdb
          chmod +x /tmp/duckdb/duckdb
          /tmp/duckdb/duckdb --version
      - name: Upload analysis tools
        uses: actions/upload-artifact@v4
        with:
          name: valorant-analysis-linux-x64
          path: |
            /tmp/vrfkit/target/release/vrfkit
            /tmp/duckdb/duckdb
          if-no-files-found: error
          retention-days: 1
